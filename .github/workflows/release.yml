name: Release

# Builds the NIMVORO installer (NSIS) and publishes a GitHub Release when a vX.Y.Z tag is pushed.
# The launcher finds the *-setup.exe asset in the release and offers to update.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versions match the tag
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($pkg -ne $conf -or $pkg -ne $cargo) { throw "Version mismatch: package.json $pkg, tauri.conf.json $conf, Cargo.toml $cargo" }
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$pkg") { throw "Tag ${{ github.ref_name }} does not match version $pkg" }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Type check and build the UI
        run: npm run build

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: NIMVORO ${{ github.ref_name }}
          releaseBody: Windows installer is the *-setup.exe file below. An installed NIMVORO offers the update by itself.
          releaseDraft: false
          prerelease: false
